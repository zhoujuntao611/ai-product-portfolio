name: Verify portfolio projects
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  oriel:
    name: Oriel maintenance and source integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Verify complete source snapshot and licenses
        run: python scripts/check-oriel-source.py
      - name: Verify source provenance checks reject invalid snapshots
        run: python -m unittest discover -s scripts -p test_oriel_source_integrity.py -v
      - name: Install locked runtime and test dependencies
        working-directory: projects/oriel/source
        run: uv sync --frozen --extra dev --dev
      - name: Verify maintenance, regression evidence, transactions and configuration
        working-directory: projects/oriel/source
        run: >-
          uv run --frozen --extra dev pytest
          tests/test_maintenance.py tests/test_maintenance_regression.py
          tests/test_maintenance_store_transactions.py
          tests/test_config_pico_loader.py tests/test_config_cfg1.py
          tests/test_config_loader.py -q
          --junitxml=.pico/evidence/maintenance-tests.xml
      - name: Verify deterministic maintenance demo with the production shell
        working-directory: projects/oriel/source
        run: uv run --frozen --extra dev python scripts/demo_maintenance_regression.py
      - name: Check changed maintenance Python files
        working-directory: projects/oriel/source
        run: >-
          uv run --frozen --extra dev ruff check
          pico/config/pico.py pico/maintenance/factory.py
          pico/maintenance/runner.py pico/maintenance/store.py
          tests/test_maintenance_regression.py tests/test_maintenance_store_transactions.py
          scripts/demo_maintenance_regression.py
      - name: Save maintenance test and candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oriel-maintenance-evidence
          path: projects/oriel/source/.pico/evidence/
          if-no-files-found: ignore
          retention-days: 14

  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: SupportFlow engineering checks
        working-directory: projects/supportflow
        run: python -m unittest discover -s tests -v
      - name: SupportFlow synthetic regression
        working-directory: projects/supportflow
        run: |
          python evaluate.py
          python verification/review_regression.py
      - name: MetricPilot offline checks
        working-directory: projects/metricpilot
        run: |
          python evaluate.py
          python evaluate_tasks.py
          python verification/replay_20261019.py
      - name: Install ClimbAI backend dependencies
        working-directory: projects/climbai
        run: python -m pip install -r requirements.txt
      - name: ClimbAI backend checks
        working-directory: projects/climbai
        run: python -m pytest tests/backend -q
      - name: ClimbAI knowledge acceptance
        working-directory: projects/climbai
        run: python -m backend.evaluate_knowledge --output verification/knowledge-retrieval-ci.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            projects/climbai/package-lock.json
            projects/panji/package-lock.json
      - name: Install ClimbAI frontend dependencies
        working-directory: projects/climbai
        run: npm ci
      - name: Build ClimbAI frontend
        working-directory: projects/climbai
        run: npm run build
      - name: Install Panji offline verification dependencies
        working-directory: projects/panji
        run: npm ci
      - name: Panji offline checks
        working-directory: projects/panji
        run: npm run verify

  website:
    name: Portfolio links and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Select preinstalled Chrome
        shell: bash
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser_path" ]; then
            echo "This runner image must include Chrome or Chromium." >&2
            exit 1
          fi
          echo "QA_BROWSER_PATH=$browser_path" >> "$GITHUB_ENV"
          "$browser_path" --version
      - name: Check local links and Pages behavior
        run: npm run verify:site
      - name: Check both local product interfaces
        run: npm run check:workspaces
      - name: Save browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-checks
          path: |
            verification/site-current/
            verification/workspaces-current/
          if-no-files-found: ignore
          retention-days: 14
