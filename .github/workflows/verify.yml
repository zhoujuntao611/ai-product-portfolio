name: Verify portfolio projects
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: SupportFlow engineering checks
        working-directory: projects/supportflow
        run: python -m unittest discover -s tests -v
      - name: SupportFlow synthetic regression
        working-directory: projects/supportflow
        run: |
          python evaluate.py
          python verification/review_regression.py
      - name: MetricPilot offline checks
        working-directory: projects/metricpilot
        run: |
          python evaluate.py
          python evaluate_tasks.py
          python verification/replay_20261019.py
      - name: Install ClimbAI backend dependencies
        working-directory: projects/climbai
        run: python -m pip install -r requirements.txt
      - name: ClimbAI backend checks
        working-directory: projects/climbai
        run: python -m pytest tests/backend -q
      - name: ClimbAI knowledge acceptance
        working-directory: projects/climbai
        run: python -m backend.evaluate_knowledge --output verification/knowledge-retrieval-ci.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            projects/climbai/package-lock.json
            projects/panji/package-lock.json
      - name: Install ClimbAI frontend dependencies
        working-directory: projects/climbai
        run: npm ci
      - name: Build ClimbAI frontend
        working-directory: projects/climbai
        run: npm run build
      - name: Verify ClimbAI Pages copy matches this build
        run: node scripts/check-climbai-build.mjs
      - name: Install Panji offline verification dependencies
        working-directory: projects/panji
        run: npm ci
      - name: Panji offline checks
        working-directory: projects/panji
        run: npm run verify

  website:
    name: Portfolio links and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Check local links and Pages behavior
        run: npm run verify:site
      - name: Save browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-checks
          path: verification/site-current/
          if-no-files-found: ignore
          retention-days: 14
